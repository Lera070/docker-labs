services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - php

  php:
    build: ./php
    depends_on:
      - mysql
      - postgres
      - redis

  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: testdb
      MARIADB_USER: dbuser
      MARIADB_PASSWORD: dbpassword

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword

  redis:
    image: redis:7-alpine